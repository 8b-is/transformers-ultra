name: Build documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release
      - use_templates

permissions:
  contents: read

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@6f0962e04218e46b8117ac5990789cccebb647d8  # main (light installs, no custom container)
    with:
      commit_sha: ${{ github.sha }}
      repo_owner: ${{ github.repository_owner }}
      package: ${{ github.event.repository.name }}
      package_name: transformers
      python_version: "3.12"
      # Enforce this fork's runtime bounds after the generic light install.
      pre_command: uv pip install "./${{ github.event.repository.name }}"
      path_to_docs: ${{ github.event.repository.name }}/docs/source/en
      notebook_folder: transformers_doc
    secrets:
      token: ${{ secrets.HUGGINGFACE_PUSH }}
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}

   # Translations are produced by doc-builder's translate_docs.yml.
